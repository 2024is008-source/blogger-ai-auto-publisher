name: Generate SEO Article

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Main keyword or article topic"
        required: true
        type: string
      title:
        description: "Optional article title (leave blank for AI title)"
        required: false
        default: ""
        type: string
      secondary_keywords:
        description: "Comma-separated secondary keywords"
        required: false
        default: ""
        type: string
      target_country:
        description: "Target country"
        required: false
        default: "United States"
        type: string
      target_audience:
        description: "Target audience"
        required: false
        default: "General readers"
        type: string
      language:
        description: "Article language"
        required: false
        default: "English"
        type: string
      writing_style:
        description: "Writing style"
        required: false
        default: "Informative and practical"
        type: string
      article_length:
        description: "Article length"
        required: false
        default: "medium"
        type: choice
        options:
          - short
          - medium
          - long
      num_sections:
        description: "Number of H2 sections"
        required: false
        default: "5"
        type: string
      num_images:
        description: "Number of licensed images"
        required: false
        default: "2"
        type: string
      target_blog_id:
        description: "Target Blogger Blog ID (defaults to BLOGGER_BLOG_ID secret)"
        required: false
        default: ""
        type: string
      template:
        description: "Article template"
        required: false
        default: "informational_guide"
        type: choice
        options:
          - informational_guide
          - how_to_tutorial
          - listicle
          - product_comparison
          - beginner_guide
          - news_article
          - home_and_lifestyle
      publishing_mode:
        description: "Queue publishing mode"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - manual
          - scheduled
          - automatic
      scheduled_time:
        description: "Optional ISO-8601 scheduled publication time"
        required: false
        default: ""
        type: string
      timezone:
        description: "IANA timezone name (e.g., UTC, America/New_York)"
        required: false
        default: "UTC"
        type: string
      fetch_images:
        description: "Automatically search and attach copyright-permitted images"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: blogger-data-write
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate SEO article and enqueue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          OPENVERSE_ENABLED: ${{ vars.OPENVERSE_ENABLED || 'true' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IMAGE_HOST_PROVIDER: ${{ vars.IMAGE_HOST_PROVIDER || 'none' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          GITHUB_IMAGE_REPO: ${{ vars.GITHUB_IMAGE_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_SECONDARY: ${{ inputs.secondary_keywords }}
          INPUT_COUNTRY: ${{ inputs.target_country }}
          INPUT_AUDIENCE: ${{ inputs.target_audience }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_STYLE: ${{ inputs.writing_style }}
          INPUT_LENGTH: ${{ inputs.article_length }}
          INPUT_SECTIONS: ${{ inputs.num_sections }}
          INPUT_IMAGES: ${{ inputs.num_images }}
          INPUT_BLOG_ID: ${{ inputs.target_blog_id }}
          INPUT_TEMPLATE: ${{ inputs.template }}
          INPUT_MODE: ${{ inputs.publishing_mode }}
          INPUT_SCHEDULED: ${{ inputs.scheduled_time }}
          INPUT_TIMEZONE: ${{ inputs.timezone }}
          INPUT_FETCH_IMAGES: ${{ inputs.fetch_images }}
        run: |
          ARGS=(
            -m backend.main generate
            --keyword "$INPUT_TOPIC"
            --title "$INPUT_TITLE"
            --secondary-keywords "$INPUT_SECONDARY"
            --country "$INPUT_COUNTRY"
            --audience "$INPUT_AUDIENCE"
            --language "$INPUT_LANGUAGE"
            --style "$INPUT_STYLE"
            --length "$INPUT_LENGTH"
            --sections "$INPUT_SECTIONS"
            --images "$INPUT_IMAGES"
            --blog-id "$INPUT_BLOG_ID"
            --template "$INPUT_TEMPLATE"
            --mode "$INPUT_MODE"
            --scheduled-time "$INPUT_SCHEDULED"
            --timezone "$INPUT_TIMEZONE"
          )
          if [ "$INPUT_FETCH_IMAGES" = "true" ]; then
            ARGS+=(--fetch-images)
          fi
          python "${ARGS[@]}" > generation-report.json

      - name: Refresh static articles index
        run: |
          python -c "
          import json
          from pathlib import Path
          ids = sorted(p.stem for p in Path('data/articles').glob('*.json') if p.stem != 'index')
          Path('data/articles/index.json').write_text(json.dumps(ids, indent=2) + '\n', encoding='utf-8')
          "

      - name: Upload generation report artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-article-report
          path: generation-report.json
          retention-days: 14

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): add generated article and update queue"
            git push
          fi
