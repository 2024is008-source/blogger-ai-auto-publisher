name: Publish Article to Blogger

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: "Article ID stored in data/articles/<article_id>.json"
        required: true
        type: string
      target_blog_id:
        description: "Target Blogger Blog ID (defaults to article or BLOGGER_BLOG_ID secret)"
        required: false
        default: ""
        type: string
      publishing_mode:
        description: "Publishing mode"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - manual
          - scheduled
      scheduled_time:
        description: "ISO-8601 publication time (required for scheduled mode)"
        required: false
        default: ""
        type: string
      timezone:
        description: "IANA timezone name"
        required: false
        default: "UTC"
        type: string

permissions:
  contents: write

concurrency:
  group: blogger-data-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Publish article via Blogger API v3
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_ARTICLE_ID: ${{ inputs.article_id }}
          INPUT_BLOG_ID: ${{ inputs.target_blog_id }}
          INPUT_MODE: ${{ inputs.publishing_mode }}
          INPUT_SCHEDULED: ${{ inputs.scheduled_time }}
          INPUT_TIMEZONE: ${{ inputs.timezone }}
        run: |
          python -m backend.main publish \
            --article-id "$INPUT_ARTICLE_ID" \
            --blog-id "$INPUT_BLOG_ID" \
            --mode "$INPUT_MODE" \
            --scheduled-time "$INPUT_SCHEDULED" \
            --timezone "$INPUT_TIMEZONE" > publish-report.json

      - name: Upload publish report artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-report
          path: publish-report.json
          retention-days: 14

      - name: Commit updated history and article status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): record Blogger publication result"
            git push
          fi
